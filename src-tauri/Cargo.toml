[package]
name="tiktoklive-music-player"
version="0.1.0"
description="Local-first live music player"
authors=["Khirul Anuar"]
edition="2021"

[lib]
name="tiktoklive_music_player_lib"
crate-type=["staticlib","cdylib","rlib"]

[build-dependencies]
tauri-build={version="2",features=[]}

[dependencies]
tauri={version="2",features=["protocol-asset"]}
tauri-plugin-dialog="2"
tauri-plugin-opener="2"
serde={version="1",features=["derive"]}
walkdir="2"
urlencoding="2"
